  <!-- THEME: set before first paint so there's no flash of the wrong theme -->
  <script>
    (function () {
      var t;
      try { t = localStorage.getItem("le-theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") {
        t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-bs-theme", t);
    })();
  </script>
  <!-- GOOGLE FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <!-- BOOTSTRAP 5 CSS + ICONS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

<body class="contact-page">
  <!-- NAV BAR -->
  <a class="visually-hidden-focusable skip-link" href="#main">Skip to content</a>

          <i class="bi bi-sun-fill theme-icon-to-light" aria-hidden="true"></i>
        </button>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
          aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
      </div>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="login.html">Forms</a></li>

        </ul>
        <form class="site-search" role="search" hidden>
          <i class="bi bi-search" aria-hidden="true"></i>
          <input class="form-control" type="search" id="site-search" placeholder="Filter this page…"
            aria-label="Filter this page" autocomplete="off" />
        </form>
      </div>
    </div>
  </nav>
  <main id="main">
  <hr />

  <!-- CONTACT SECTION -->
  <section id="contact" class="py-5">
    <div class="container shadow-lg mb-5 py-4">
      <div class="container py-4">
        <div class="row justify-content-center">
          <div class="col-lg-6">
            <div class="card shadow-lg border-primary">
              <div class="card-body">
                <h2 class="text-center mb-4">Contact</h2>
                <form class="js-contact-form" action="https://formspree.io/f/maendkjd" method="POST">
                  <!-- Formspree form ID (same in index, about and contact pages) -->
                  <input type="hidden" name="_subject" value="LE Cyber-Docs contact (Contact page)" />
                  <!-- Spam trap: real people never see or fill this -->
                  <input type="text" name="_gotcha" class="d-none" tabindex="-1" autocomplete="off" aria-hidden="true" />
                  <div class="mb-3">
                    <label for="name" class="form-label">Name</label>
                    <input type="text" name="name" class="form-control" id="name" placeholder="Enter full name" autocomplete="name" required />
                  </div>
                  <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" id="email" placeholder="some@Email.com" autocomplete="email" required />
                  </div>
                  <div class="mb-3">
                    <label for="message" class="form-label">Message</label>
                    <textarea class="form-control" name="message" id="message" rows="5" required
                      placeholder="Enter your message"></textarea>
                  </div>
                  <div class="text-center">
                    <button type="submit" class="btn btn-primary btn-md">
                      Submit
                    </button>
                  </div>
                  <div class="form-status mt-3 d-none" role="status" aria-live="polite"></div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
  <hr />

  </main>

  <!-- SCROLL TO TOP BUTTON -->
  <button class="scroll-to-top" type="button" aria-label="Scroll to top" title="Scroll to top">
    <i class="bi bi-arrow-up" aria-hidden="true"></i>

  <script src="assets/js/main.js"></script>
